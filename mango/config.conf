# More option see https://github.com/DreamMaoMao/mango/wiki/
exec_once=waybar
exec_once=swaybg -i ~/.config/mango/wallpaper/current.png
window_rule=is_floating:1,width:900,height:600,app_id:^org\.omarchy\.
env=PATH,/home/dice/.custom-apps:/usr/local/sbin:/usr/local/bin:/usr/bin
env=XDG_DATA_DIRS,/usr/local/share:/usr/share:/var/lib/flatpak/exports/share:/home/dice/.local/share/flatpak/exports/share
window_rule=is_floating:1,width:0.7,height:0.7,app_id:com.gabm.satty
exec_once=/usr/lib/soteria-polkit/soteria
exec_once=discord
exec_once=steam

cursor_theme=Posy_Cursor
# cursor_size=50


# Window effect
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes = 1
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9 
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor = 1
focus_direction_only_zone_overlap=1
focus_cross_tag = 1
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitor_rule=name:DP-2,width:1920,height:1080,refresh:239.757,x:1920,y:0,scale:1,vrr:0,rr:0,primary:1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=flat
# force_no_accel=1
mouse_accel_speed=-0.5
sloppy_focus=1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color = 0x1a1b26ff
border_color = 0x586691ff
drop_color = 0x7aa2f780
split_color = 0x9ece6aff
focus_color = 0x7aa2f7ff
maximized_screen_color = 0xbb9af7ff
urgent_color = 0xf7768eff
scratchpad_color = 0x9ece6aff
global_color = 0x003dbfff
overlay_color = 0x4f00dfff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,SUPER,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,W,spawn,/home/dice/.config/rofi/launchers/type-3/launcher.sh
bind=SUPER,Q,spawn,kitty
bind=SUPER,F,spawn,thunar
bind=SUPER,D,spawn,helium
# bind=SUPER,Z,spawn,discord
bind=SUPER,ESCAPE,spawn,/home/dice/.config/rofi/powermenu/type-2/powermenu.sh

bind=SUPER,period,spawn,/home/dice/.config/rofi/emoji-picker/type-3/launcher.sh

bind=NONE,Print,spawn,cmd-screenshot

# exit (SHIFT added so it can't be hit by accident)
bind=SUPER+SHIFT,m,quit

bind=SUPER,c,killclient,


window_rule=is_named_scratchpad:1,width:0.8,height:0.85,app_id:discord
bind=SUPER,Z,toggle_named_scratchpad,discord,none,discord

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,togglejump,
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,t,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,Return,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized,
bind = super+alt,z,toggle_scratchpad

# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=SUPER+CTRL+SHIFT,Left,scroller_stack,left
bind=SUPER+CTRL+SHIFT,Right,scroller_stack,right
bind=SUPER+CTRL+SHIFT,Up,scroller_stack,up
bind=SUPER+CTRL+SHIFT,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=SUPER+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,bracketleft,viewtoleft,0
bind=SUPER,bracketright,viewtoright,0
bind=CTRL+ALT,Left,viewtoleft_have_client,0
bind=CTRL+ALT,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=SUPER,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
# bind=SUPER,comma,focusmon,left
# bind=SUPER,period,focusmon,right
bind=SUPER+ALT,comma,tagmon,left
bind=SUPER+ALT,period,tagmon,right

# gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,C,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# # movewin
# bind=SUPER+CTRL,Up,movewin,+0,-50
# bind=SUPER+CTRL,Down,movewin,+0,+50
# bind=SUPER+CTRL,Left,movewin,-50,+0
# bind=SUPER+CTRL,Right,movewin,+50,+0

# # resizewin
# bind=SUPER+ALT+SHIFT,Up,resizewin,+0,-50
# bind=SUPER+ALT+SHIFT,Down,resizewin,+0,+50
# bind=SUPER+ALT+SHIFT,Left,resizewin,-50,+0
# bind=SUPER+ALT+SHIFT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
# (middle-click bind removed so paste-on-middle-click works)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofiw
shadows_color = 0x15161eff
root_color = 0x1a1b26ff
border_color = 0x586691ff
drop_color = 0x7aa2f780
split_color = 0x9ece6aff
focus_color = 0x7aa2f7ff
maximized_screen_color = 0xbb9af7ff
urgent_color = 0xf7768eff
scratchpad_color = 0x9ece6aff
global_color = 0x003dbfff
overlay_color = 0x4f00dfff
group_bar_decorate_bg_color = 0x2c3148ff
group_bar_decorate_border_color = 0x586691ff
group_bar_decorate_fg_color = 0xc0caf5ff
group_bar_decorate_focus_bg_color = 0x7aa2f7ff
group_bar_decorate_focus_fg_color = 0x16161eff
jump_label_decorate_bg_color = 0x2c3148ff
jump_label_decorate_border_color = 0x586691ff
jump_label_decorate_fg_color = 0xc0caf5ff
jump_label_decorate_focus_bg_color = 0x7aa2f7ff
jump_label_decorate_focus_fg_color = 0x16161eff
scratchpad_cross_monitor = 1
exchange_cross_monitor = 1
always_show_group_bar=0Z
group_bar_close_button_enable=1
tag_rule=id:1,layout_name:dwindle